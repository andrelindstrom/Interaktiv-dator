<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Interaktiv Datorarkitektur</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --board-bg: #090d16;
  --board-surface: #0f172a;
  --board-edge: #020617;
  --trace-color: rgba(56, 189, 248, 0.2);
  --trace-active: #38bdf8;
  --power-trace: rgba(244, 63, 94, 0.3);
  --power-active: #f43f5e;
  --gold: #fbbf24;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --panel-bg: #1e293b;
  --panel-border: #334155;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Inter', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--board-bg); color: var(--text-main); font-family: var(--font-sans); }
body {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% 0%, rgba(56, 189, 248, 0.05), transparent 70%), var(--board-bg);
}

.wrap { 
  width: 100%; 
  max-width: 100%; 
  margin: 0 auto; 
  padding: 24px 32px 40px; 
}

header {
  margin-bottom: 24px;
  border-bottom: 1px solid var(--panel-border);
  padding-bottom: 16px;
}
.eyebrow {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--trace-active);
  display: flex;
  align-items: center;
  gap: 8px;
}
.eyebrow::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--trace-active); box-shadow: 0 0 10px var(--trace-active);
}
h1 { font-family: var(--font-mono); font-size: clamp(26px, 3vw, 36px); margin: 6px 0; font-weight: 700; }
.sub-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.sub { color: var(--text-muted); font-size: 15px; max-width: 800px; margin: 0; }

.layout { 
  display: grid; 
  grid-template-columns: minmax(0, 1fr) 380px; 
  gap: 24px; 
  align-items: stretch;
  height: clamp(480px, 60vh, 620px);
}

@media (max-width: 1200px) { 
  .layout { grid-template-columns: minmax(0, 1fr) 320px; } 
}
@media (max-width: 960px) { 
  .layout { 
    grid-template-columns: 1fr; 
    height: auto;
  } 
}

.board-card {
  background: var(--board-edge);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 36px 16px 16px;
  position: relative;
  box-shadow: inset 0 0 80px rgba(0,0,0,0.8);
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.board-hint {
  position: absolute;
  top: 12px;
  left: 16px;
  font-family: var(--font-mono); font-size: 11px; color: var(--text-muted);
  letter-spacing: 0.08em;
}

svg { 
  display: block; 
  width: 100%; 
  height: 100%; 
  max-height: 100%;
  object-fit: contain;
}

.trace { fill: none; stroke: var(--trace-color); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s, filter .3s; }
.trace.power { stroke: var(--power-trace); stroke-width: 4.5; }
.trace.active { stroke: var(--trace-active); filter: drop-shadow(0 0 8px var(--trace-active)); }
.trace.power.active { stroke: var(--power-active); filter: drop-shadow(0 0 10px var(--power-active)); }

.chip { cursor: pointer; }
.chip .hitbox { fill: transparent; }
.chip .outline {
  stroke: var(--panel-border); stroke-width: 1.5; fill: var(--board-surface);
  transition: stroke .2s, filter .2s;
}
.chip:hover .outline { stroke: var(--trace-active); filter: drop-shadow(0 0 8px rgba(56,189,248,0.4)); }
.chip.selected .outline { stroke: var(--trace-active); fill: #1e293b; filter: drop-shadow(0 0 12px rgba(56,189,248,0.6)); }

.chip-label { font-family: var(--font-mono); font-size: 14px; font-weight: 700; fill: var(--text-main); pointer-events: none; }
.chip-sub { font-family: var(--font-mono); font-size: 10px; fill: var(--text-muted); pointer-events: none; }
.screwhole { fill: #020617; stroke: var(--panel-border); stroke-width: 1.5; }

.pulse { r: 5; fill: var(--trace-active); filter: drop-shadow(0 0 8px var(--trace-active)); opacity: 0; }

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 24px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 14px;
  box-sizing: border-box;
  overflow-y: auto;
}

.panel-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--trace-active); }
.panel h2 { font-family: var(--font-mono); font-size: 22px; margin: 0; }
.panel p { font-size: 14px; line-height: 1.6; color: #cbd5e1; margin: 0; }
.fact-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fact-list li { font-size: 13px; line-height: 1.5; color: var(--text-muted); padding-left: 14px; position: relative; }
.fact-list li::before { content: "›"; position: absolute; left: 0; color: var(--trace-active); font-weight: bold; }
.divider { height: 1px; background: var(--panel-border); margin: 4px 0; }

.bitbox { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.bit-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bit-val { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.bit {
  width: 32px; height: 36px; border-radius: 6px; border: 1px solid var(--panel-border);
  background: var(--board-edge); color: var(--text-muted); font-family: var(--font-mono);
  font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.bit.on { background: rgba(56,189,248,0.2); color: var(--trace-active); border-color: var(--trace-active); box-shadow: 0 0 10px rgba(56,189,248,0.3); }
.bit-readout { font-family: var(--font-mono); font-size: 20px; color: var(--gold); margin-bottom: 6px; }
.bit-readout span { font-size: 12px; color: var(--text-muted); }

.cycle-steps { display: flex; gap: 4px; margin: 6px 0; }
.cycle-dot { flex: 1; height: 6px; border-radius: 3px; background: var(--panel-border); }
.cycle-dot.done { background: var(--trace-active); }
.cycle-btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn {
  font-family: var(--font-mono); font-size: 12px; background: rgba(255,255,255,0.05); color: var(--text-main);
  border: 1px solid var(--panel-border); padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: all .15s;
}
.btn:hover { background: rgba(255,255,255,0.1); }
.btn.primary { background: rgba(56,189,248,0.2); border-color: var(--trace-active); color: var(--trace-active); }
.btn.primary:hover { background: rgba(56,189,248,0.3); }
.btn.auto-run { background: rgba(251,191,36,0.15); border-color: var(--gold); color: var(--gold); }
.btn.auto-run:hover { background: rgba(251,191,36,0.25); }
.btn-launch {
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  background: rgba(56,189,248,0.15); border: 1px solid var(--trace-active); color: var(--trace-active);
  padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: all .2s;
  box-shadow: 0 0 12px rgba(56,189,248,0.15);
}
.btn-launch:hover { background: rgba(56,189,248,0.25); box-shadow: 0 0 16px rgba(56,189,248,0.3); }
.btn:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">Interaktiv Modul · Synchronized Height</div>
    <h1>Datorns Huvudkomponenter</h1>
    <div class="sub-bar">
      <p class="sub">Visualisering av kommunikationsvägar, logik och hårdvara på ett moderkort. Klicka på valfri enhet eller starta flödessimuleringen.</p>
      <button class="btn-launch" onclick="startProgramSequence()">Kör programsekvens ⚙</button>
    </div>
  </header>

  <div class="layout">
    <div class="board-card">
      <div class="board-hint">// INTERAKTIVT MODERKORT (WIDESCREEN 1200x550)</div>
      <svg viewBox="0 0 1200 550" xmlns="http://www.w3.org/2000/svg">
        <path id="t-psu-cpu" class="trace power" d="M 1080,40 L 1080,20 L 580,20 L 580,110" />
        <path id="t-psu-pch" class="trace power" d="M 1100,180 L 1100,300 L 590,300 L 590,340" />
        <path id="t-psu-gpu" class="trace power" d="M 1120,180 L 1120,490 L 240,490 L 240,465" />
        <path id="t-cpu-ram" class="trace" d="M 630,110 L 630,75 L 820,75" />
        <path id="t-cpu-pch" class="trace" d="M 530,240 L 530,340" />
        <path id="t-cpu-gpu" class="trace" d="M 480,180 L 320,180 L 320,390 L 390,390" />
        <path id="t-pch-storage" class="trace" d="M 640,390 L 880,390" />
        <path id="t-pch-io" class="trace" d="M 520,410 L 460,410 L 460,300 L 90,300 L 90,240" />

        <circle class="pulse" id="pulse1"/>

        <g class="chip" data-id="cpu" transform="translate(480,110)">
          <rect class="hitbox" width="180" height="130"/>
          <rect class="outline" width="180" height="130" rx="8"/>
          <rect x="25" y="20" width="130" height="90" rx="4" fill="#334155"/>
          <text class="chip-label" x="90" y="62" text-anchor="middle">CPU</text>
          <text class="chip-sub" x="90" y="80" text-anchor="middle">PROCESSOR</text>
        </g>

        <g class="chip" data-id="ram" transform="translate(820,30)">
          <rect class="hitbox" width="180" height="90"/>
          <rect class="outline" width="28" height="90" rx="3"/>
          <rect class="outline" x="42" width="28" height="90" rx="3"/>
          <rect class="outline" x="84" width="28" height="90" rx="3"/>
          <text class="chip-label" x="57" y="115" text-anchor="middle">RAM</text>
          <text class="chip-sub" x="57" y="130" text-anchor="middle">ARBETSMINNE</text>
        </g>

        <g class="chip" data-id="pch" transform="translate(520,340)">
          <rect class="hitbox" width="120" height="90"/>
          <rect class="outline" width="120" height="90" rx="6"/>
          <rect x="15" y="15" width="90" height="60" rx="3" fill="#0f172a" stroke="#334155"/>
          <text class="chip-label" x="60" y="46" text-anchor="middle" style="font-size:12px;">CHIPSET</text>
          <text class="chip-sub" x="60" y="62" text-anchor="middle">PCH NAV</text>
        </g>

        <g class="chip" data-id="gpu" transform="translate(50,370)">
          <rect class="hitbox" width="340" height="95"/>
          <rect class="outline" width="340" height="95" rx="6"/>
          <circle cx="80" cy="47" r="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
          <circle cx="180" cy="47" r="28" fill="#0f172a" stroke="#334155" stroke-width="2"/>
          <text class="chip-label" x="275" y="48" text-anchor="middle">GPU</text>
          <text class="chip-sub" x="275" y="64" text-anchor="middle">GRAFIKKORT</text>
        </g>

        <g class="chip" data-id="storage" transform="translate(880,360)">
          <rect class="hitbox" width="180" height="65"/>
          <rect class="outline" width="180" height="65" rx="4"/>
          <rect x="15" y="15" width="45" height="35" fill="#0f172a"/>
          <text class="chip-label" x="120" y="34" text-anchor="middle">SSD</text>
          <text class="chip-sub" x="120" y="49" text-anchor="middle">LAGRING</text>
        </g>

        <g class="chip" data-id="psu" transform="translate(1020,40)">
          <rect class="hitbox" width="120" height="140"/>
          <rect class="outline" width="120" height="140" rx="6"/>
          <text class="chip-label" x="60" y="65" text-anchor="middle">PSU</text>
          <text class="chip-sub" x="60" y="82" text-anchor="middle">STRÖM</text>
        </g>

        <g class="chip" data-id="io" transform="translate(50,110)">
          <rect class="hitbox" width="100" height="130"/>
          <rect class="outline" width="80" height="130" rx="4"/>
          <rect x="12" y="15" width="22" height="14" fill="#334155"/>
          <rect x="12" y="38" width="22" height="14" fill="#334155"/>
          <rect x="12" y="70" width="34" height="18" fill="#334155"/>
          <text class="chip-label" x="40" y="112" text-anchor="middle">I/O</text>
        </g>

        <circle class="screwhole" cx="30" cy="30" r="8"/>
        <circle class="screwhole" cx="1170" cy="30" r="8"/>
        <circle class="screwhole" cx="30" cy="520" r="8"/>
        <circle class="screwhole" cx="1170" cy="520" r="8"/>
      </svg>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
const DATA = {
  cpu: {
    tag: "CENTRAL PROCESSING UNIT", title: "CPU — Processorn",
    intro: "Processorn är datorns hjärna. Den hämtar instruktioner från minnet, dekoderar dem och utför alla nödvändiga beräkningar.",
    facts: [
      "När ett program startas läses det först in från SSD via Chipset till RAM.",
      "Klockfrekvensen anger antalet beräkningscykler per sekund (ex. 4.0 GHz = 4 miljarder cykler/sek).",
      "Innehåller supersnabba, interna minnen kallade cache (L1, L2, L3)."
    ],
    traces: ["t-psu-cpu", "t-cpu-ram", "t-cpu-gpu", "t-cpu-pch"], extra: null
  },
  pch: {
    tag: "TRAFIKLEDAREN (CHIPSET)", title: "Chipset / PCH",
    intro: "Platform Controller Hub (PCH) fungerar som en koordinator på moderkortet. Den hanterar kommunikationen mellan CPU:n och långsammare enheter.",
    facts: [
      "Spänningsmatas via moderkortets 24-pin ATX-kontakt och egna regulatorer (VRM).",
      "Slussar data från SSD till RAM när du startar ett nytt program.",
      "Avlastar CPU:n genom att styra datatrafik till USB-portar, SATA/NVMe-lagring och ljudkort.",
      "Kopplas till CPU:n via en snabb buss (t.ex. DMI - Direct Media Interface)."
    ],
    traces: ["t-psu-pch", "t-cpu-pch", "t-pch-storage", "t-pch-io"], extra: null
  },
  ram: {
    tag: "TEMPORÄRT MINNE", title: "RAM — Arbetsminne",
    intro: "Korttidsminne som lagrar data för de program som aktivt körs. Det har extremt hög läs- och skrivhastighet jämfört med lagringsenheter.",
    facts: [
      "Laddas fullt med programkod från SSD när applikationer startas.",
      "Flyktigt minne (Volatile): All data raderas direkt när datorn stängs av.",
      "Möjliggör blixtsnabb datatillgång för CPU:n."
    ],
    traces: ["t-cpu-ram"], extra: "bits"
  },
  gpu: {
    tag: "GRAFIKMOTOR", title: "GPU — Grafikkort",
    intro: "Specialiserad processor utformad för att hantera tusentals parallella beräkningar samtidigt. Perfekt för 3D-grafik, video och AI.",
    facts: [
      "Innehåller tusentals mindre kärnor optimerade för matrisberäkningar.",
      "Har eget dedikerat minne som kallas VRAM.",
      "Avlastar CPU:n från tunga visuella och matematiska beräkningar."
    ],
    traces: ["t-psu-gpu", "t-cpu-gpu"], extra: null
  },
  storage: {
    tag: "PERMANENT LAGRING", title: "SSD — Solid State Drive",
    intro: "Datorns långtidsminne där operativsystem, filer och installerade program sparas permanent.",
    facts: [
      "Innehåller alla programfiler. Vid start skickas dessa via Chipset hela vägen upp till CPU och RAM.",
      "Icke-flyktigt minne: Data finns kvar även när strömmen bryts.",
      "Innehåller inga rörliga delar till skillnad från äldre mekaniska hårddiskar (HDD)."
    ],
    traces: ["t-pch-storage", "t-cpu-pch"], extra: null
  },
  psu: {
    tag: "STRÖMFÖRSÖRJNING", title: "PSU — Nätaggregat",
    intro: "Omvandlar växelström (AC) från vägguttaget till stabil likström (DC) med rätt spänningsnivåer för datorns komponenter.",
    facts: [
      "Levererar spänningar på huvudsakligen 12V, 5V och 3.3V",
      "Effektiviteten mäts ofta med 80 Plus-certifieringar (Gold, Platinum, etc.).",
      "Matar ström direkt till CPU, GPU, PCH och moderkort."
    ],
    traces: ["t-psu-cpu", "t-psu-gpu", "t-psu-pch"], extra: null
  },
  io: {
    tag: "IN- OCH UTGÅNGAR", title: "I/O — In- och utportar",
    intro: "Gränssnittet som tillåter datorn att kommunicera med omvärlden och tillkopplad kringutrustning.",
    facts: [
      "Hanterar in-signaler (mus, tangentbord) och ut-signaler (skärm, ljud).",
      "Signalerna går från I/O-portarna via PCH (Chipset) vidare upp till CPU:n.",
      "Inkluderar standarder som USB, HDMI, Ethernet och DisplayPort."
    ],
    traces: ["t-pch-io", "t-cpu-pch"], extra: null
  },
  program_flow: {
    tag: "SIMULERING", title: "Program- & Dataflöde",
    intro: "Steg-för-steg visualisering över hur ett program laddas, tar emot indata från tangentbordet, lagras i RAM och behandlas av hårdvaran.",
    facts: [],
    traces: [], extra: "program_flow"
  }
};

const PROGRAM_STEPS = [
  { phase: "FAS 1: LADDA PROGRAM", label: "1. SSD → CHIPSET (PCH)", desc: "Du startar ett program. Programfiler läses från SSD:n och skickas till PCH (Chipset).", traces: [{ trace: "t-pch-storage", reverse: true }], targetChip: "pch" },
  { phase: "FAS 1: LADDA PROGRAM", label: "2. CHIPSET → CPU NAV", desc: "PCH skickar data vidare till moderkortets centrala bussar mot CPU och minneshantering.", traces: [{ trace: "t-cpu-pch", reverse: true }], targetChip: "cpu" },
  { phase: "FAS 1: LADDA PROGRAM", label: "3. ÖVERFÖRING TILL RAM", desc: "Data skrivs in i RAM-minnet (arbetsminnet) så att det ligger redo för blixtsnabb åtkomst.", traces: [{ trace: "t-cpu-ram", reverse: false }], targetChip: "ram" },
  { phase: "FAS 2: INDATA & KÖR", label: "4a. INDATA: I/O → CHIPSET", desc: "Du trycker på en tangent. Tangentbordet skickar en signal via I/O-porten till PCH.", traces: [{ trace: "t-pch-io", reverse: true }], targetChip: "pch" },
  { phase: "FAS 2: INDATA & KÖR", label: "4b. INDATA: CHIPSET → CPU", desc: "PCH skickar en avbrottssignal (interrupt) vidare upp till CPU:n för att tala om att en tangent tryckts ned.", traces: [{ trace: "t-cpu-pch", reverse: true }], targetChip: "cpu" },
  { phase: "FAS 2: INDATA & KÖR", label: "4c. INDATA: CPU → RAM", desc: "CPU lagrar den mottagna tangentkoden i en indatabuffert i RAM-minnet så att programmet kan läsa den.", traces: [{ trace: "t-cpu-ram", reverse: false }], targetChip: "ram" },
  { phase: "FAS 2: INDATA & KÖR", label: "5. FETCH (HÄMTA)", desc: "CPU hämtar instruktioner från RAM för att behandla den nyss sparade tangenttryckningen.", traces: [{ trace: "t-cpu-ram", reverse: true }], targetChip: "cpu" },
  { phase: "FAS 2: INDATA & KÖR", label: "6. EXECUTE (GRAFIK)", desc: "CPU skickar instruktioner till GPU för att rita upp den inknappade bokstaven på skärmen.", traces: [{ trace: "t-cpu-gpu", reverse: false }], targetChip: "gpu" },
  { phase: "FAS 3: UTDATA & SPARA", label: "7a. UTDATA: CPU → PCH → I/O", desc: "CPU skickar utdata (t.ex. ljud vid knapptryck eller nätverksdata) via PCH ut till I/O-enheterna.", traces: [{ trace: "t-cpu-pch", reverse: false }, { trace: "t-pch-io", reverse: false }], targetChip: "io" },
  { phase: "FAS 3: UTDATA & SPARA", label: "7b. SPARA: RAM → CPU → PCH", desc: "När du sparar läses filen från RAM, går igenom CPU:n och skickas ner till PCH.", traces: [{ trace: "t-cpu-ram", reverse: true }, { trace: "t-cpu-pch", reverse: false }], targetChip: "pch" },
  { phase: "FAS 3: UTDATA & SPARA", label: "7c. SPARA: PCH → SSD", desc: "PCH skriver slutligen ner informationen permanent till SSD-enheten.", traces: [{ trace: "t-pch-storage", reverse: false }], targetChip: "storage" }
];

const panel = document.getElementById('panel');
let currentStep = 0;
let isAutoRunning = false;
let autoTimer = null;

function clearTraces() {
  document.querySelectorAll('.trace').forEach(t => t.classList.remove('active'));
}

function selectChip(id) {
  stopAutoRun();
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
  clearTraces();
  const item = DATA[id];
  if (item && item.traces) {
    item.traces.forEach(tid => {
      const el = document.getElementById(tid);
      if (el) el.classList.add('active');
    });

    const tracesInfo = item.traces.map(tid => ({ 
      trace: tid, 
      reverse: tid === 't-pch-io' || tid === 't-cpu-pch' || tid === 't-pch-storage' 
    }));
    triggerSequentialPulses(tracesInfo);
  }
  renderPanel(id, item);
}

function startProgramSequence() {
  selectChip("program_flow");
}

function renderPanel(id, d) {
  let widgetHTML = "";
  if (d.extra === "bits") {
    widgetHTML = `
      <div class="divider"></div>
      <div class="panel-tag">INTERAKTIV BINÄRRÄKNARE</div>
      <p style="margin-bottom:8px;">Klicka på bitarna nedan för att ändra värde (1 Byte):</p>
      <div class="bit-readout" id="bitReadout">0 <span>decimalt</span></div>
      <div class="bitbox" id="bitbox"></div>
    `;
  } else if (d.extra === "program_flow") {
    currentStep = 0;
    widgetHTML = `
      <div class="divider"></div>
      <div class="panel-tag" id="phaseTag">LADDA & KÖR ETT PROGRAM</div>
      <div class="cycle-steps" id="cycleDots"></div>
      <div style="font-family:var(--font-mono); font-size:13px; color:var(--trace-active); margin-top:4px;" id="cycleLabel"></div>
      <p id="cycleDesc" style="min-height:45px; margin-top:4px;"></p>
      <div class="cycle-btns">
        <button class="btn" id="btnPrev">◂ Föregående</button>
        <button class="btn primary" id="btnNext">Nästa steg ▸</button>
        <button class="btn auto-run" id="btnAuto">Kör automatiskt ▹</button>
      </div>
    `;
  }

  let factsHTML = "";
  if (d.facts && d.facts.length > 0) {
    factsHTML = `
      <div class="divider"></div>
      <ul class="fact-list">${d.facts.map(f => `<li>${f}</li>`).join('')}</ul>
    `;
  }

  panel.innerHTML = `
    <div class="panel-tag">${d.tag}</div>
    <h2>${d.title}</h2>
    <p>${d.intro}</p>
    ${factsHTML}
    ${widgetHTML}
  `;

  if (d.extra === "bits") initBits();
  if (d.extra === "program_flow") initProgramFlow();
}

function initBits() {
  const box = document.getElementById('bitbox');
  const readout = document.getElementById('bitReadout');
  const vals = [128, 64, 32, 16, 8, 4, 2, 1];
  const state = [0, 0, 0, 0, 0, 0, 0, 0];

  vals.forEach((v, i) => {
    const col = document.createElement('div');
    col.className = 'bit-col';

    const valLabel = document.createElement('div');
    valLabel.className = 'bit-val';
    valLabel.textContent = v;

    const b = document.createElement('div');
    b.className = 'bit';
    b.textContent = '0';
    b.onclick = () => {
      state[i] = state[i] ? 0 : 1;
      b.textContent = state[i];
      b.classList.toggle('on', state[i] === 1);
      const sum = state.reduce((acc, curr, idx) => acc + curr * vals[idx], 0);
      readout.innerHTML = `${sum} <span>decimalt</span>`;
    };

    col.appendChild(valLabel);
    col.appendChild(b);
    box.appendChild(col);
  });
}

function initProgramFlow() {
  const dots = document.getElementById('cycleDots');
  dots.innerHTML = PROGRAM_STEPS.map(() => `<div class="cycle-dot"></div>`).join('');
  const prev = document.getElementById('btnPrev');
  const next = document.getElementById('btnNext');
  const auto = document.getElementById('btnAuto');

  function update() {
    dots.querySelectorAll('.cycle-dot').forEach((d, i) => d.classList.toggle('done', i <= currentStep));
    const step = PROGRAM_STEPS[currentStep];
    
    document.getElementById('phaseTag').textContent = step.phase;
    document.getElementById('cycleLabel').textContent = step.label;
    document.getElementById('cycleDesc').textContent = step.desc;
    
    prev.disabled = currentStep === 0 || isAutoRunning;
    next.disabled = isAutoRunning;
    next.textContent = currentStep === PROGRAM_STEPS.length - 1 ? "Börja om ↺" : "Nästa steg ▸";
    
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('selected', c.dataset.id === step.targetChip));
    clearTraces();
    
    step.traces.forEach(t => {
      const el = document.getElementById(t.trace);
      if (el) el.classList.add('active');
    });
    
    const stepDuration = Math.max(step.traces.length * 600, 1000);
    triggerSequentialPulses(step.traces);
    return stepDuration;
  }

  function nextAutoStep() {
    if (!isAutoRunning) return;

    if (currentStep < PROGRAM_STEPS.length - 1) {
      currentStep++;
      const duration = update();
      autoTimer = setTimeout(nextAutoStep, duration + 300);
    } else {
      stopAutoRun();
    }
  }

  prev.onclick = () => {
    stopAutoRun();
    if (currentStep > 0) { currentStep--; update(); }
  };
  
  next.onclick = () => {
    stopAutoRun();
    currentStep = (currentStep === PROGRAM_STEPS.length - 1) ? 0 : currentStep + 1;
    update();
  };

  auto.onclick = () => {
    if (isAutoRunning) {
      stopAutoRun();
    } else {
      isAutoRunning = true;
      auto.textContent = "Pausa ❚❚";
      if (currentStep === PROGRAM_STEPS.length - 1) currentStep = 0;
      const duration = update();
      autoTimer = setTimeout(nextAutoStep, duration + 300);
    }
  };

  update();
}

function stopAutoRun() {
  isAutoRunning = false;
  if (autoTimer) clearTimeout(autoTimer);
  const autoBtn = document.getElementById('btnAuto');
  if (autoBtn) autoBtn.textContent = "Kör automatiskt ▹";
  const prevBtn = document.getElementById('btnPrev');
  const nextBtn = document.getElementById('btnNext');
  if (prevBtn) prevBtn.disabled = currentStep === 0;
  if (nextBtn) nextBtn.disabled = false;
}

function triggerSequentialPulses(tracesInfo) {
  const pulse = document.getElementById('pulse1');
  if (!pulse || !tracesInfo || tracesInfo.length === 0) return;

  let traceIndex = 0;

  function runNextTrace() {
    if (traceIndex >= tracesInfo.length) return;
    
    const { trace: traceId, reverse } = tracesInfo[traceIndex];
    const path = document.getElementById(traceId);
    if (!path) return;

    const length = path.getTotalLength();
    let start = null;
    const duration = 600;

    function animate(timestamp) {
      if (!start) start = timestamp;
      const elapsed = timestamp - start;
      const progress = Math.min(elapsed / duration, 1);
      const distance = reverse ? length * (1 - progress) : length * progress;
      const point = path.getPointAtLength(distance);

      pulse.setAttribute('cx', point.x);
      pulse.setAttribute('cy', point.y);
      pulse.style.opacity = '1';

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        traceIndex++;
        if (traceIndex < tracesInfo.length) {
          runNextTrace();
        } else {
          pulse.style.opacity = '0';
        }
      }
    }
    requestAnimationFrame(animate);
  }

  runNextTrace();
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => selectChip(chip.dataset.id));
});

// Startvy
panel.innerHTML = `
  <div class="panel-tag">SYSTEMSTATUS: REDO</div>
  <h2>Välj en komponent</h2>
  <p>Klicka på någon av komponenterna på kretskortet till vänster (CPU, RAM, CHIPSET/PCH, GPU, SSD, PSU eller I/O) för att visualisera hur data rör sig i datorn.</p>
  <p style="margin-top:12px; color:var(--text-muted);">Eller klicka på knappen <strong>"Kör programsekvens ⚙"</strong> i sidhuvudet för att starta en komplett flödesdemonstration.</p>
`;
</script>
